    - assets/achievements/denmark.png
    - assets/achievements/estonia.png
    - assets/achievements/finland.png
    - assets/achievements/france.png
    - assets/achievements/germany.png
    - assets/achievements/greece.png
    - assets/achievements/hungary.png
    - assets/achievements/ireland.png
    - assets/achievements/italy.png
    - assets/achievements/latvia.png
    - assets/achievements/lithuania.png
    - assets/achievements/luxembourg.png
