name = "ccs-account-deletion-scheduler"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
# Enable only after backend, rules and storage have passed end-to-end tests.
ENABLED = "false"
VERIFY_ONLY = "false"

[observability]
enabled = true
